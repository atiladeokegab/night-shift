name: smoke
# The event's smoke on every PR into integration: offline, no secrets, same `make smoke` the lead
# runs. The lead's merge tooling makes it a required check and merges a PR only once it passed.
on:
  pull_request:
    branches: [integration]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: make smoke
        run: |
          if ! make -n smoke >/dev/null 2>&1; then
            echo "No smoke target in the Makefile yet: nothing to smoke."; exit 0
          fi
          make smoke
  image:
    # Builds the image Cloud Run will run and imports the app inside it, so a dependency missing from
    # the image fails here, not after deploy. STORE_DIR: the image runs as a non-root user that cannot
    # create ./data. core.main is the app the Dockerfile runs.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: build the image, import the app inside it
        run: |
          if [ ! -f Dockerfile ]; then echo "No Dockerfile yet: no image to check."; exit 0; fi
          docker build -t app .
          docker run --rm -e STORE_DIR=/tmp/store app python -c "import core.main"
  web:
    # The page's own checks (#248): unit tests, lint, typecheck and build, then the browser tests (axe, and
    # the voice heard) against the match server with no keys and Vite, which playwright.config.ts starts.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
