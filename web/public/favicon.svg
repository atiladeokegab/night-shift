<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- The Touchline mark on the night ground: the side line breaks into amber sound bars. On a 16px grid so it stays sharp at 16, 32 and 64. -->
  <rect width="16" height="16" rx="3.5" fill="#06080F"/>
  <rect x="2" y="7" width="3" height="2" fill="#F6F4EF"/>
  <g fill="#FFB547">
    <rect x="6" y="5" width="2" height="6"/>
    <rect x="9" y="2" width="2" height="12"/>
    <rect x="12" y="4" width="2" height="8"/>
  </g>
</svg>
