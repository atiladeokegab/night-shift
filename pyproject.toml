[project]
name = "night-shift"
version = "0.1.0"
description = "Night Shift: a live AI commentator whose calls and fixes train a model through Mubit."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-cloud-storage>=2.18.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
