[project]
name = "night-shift"
version = "0.1.0"
description = "Touchline: the describer that checks itself. Replays described as if live; producer fixes train a Mubit adapter."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115.0",
    "google-cloud-storage>=2.18.0",
    "httpx>=0.27",
    "surrealdb==2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
