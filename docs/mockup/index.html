<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Touchline mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Touchline mockup: static, fake data, every screen and state. The look is in docs/design.md. */
:root {
  --bg: #06080F; --fg: #F6F4EF; --muted: rgba(246, 244, 239, .66); --faint: rgba(246, 244, 239, .42);
  --glass: rgba(14, 18, 31, .55); --line: rgba(255, 255, 255, .10); --line-hi: rgba(255, 255, 255, .20);
  --amber: #FFB547; --amber-deep: #F5A524; --on-amber: #1B1203;
  --air: #FF4D4F; --live: #3DDC84; --fix: #7CD4FF; --err: #FF6B6B;
  --esp: #C8102E; --eng: #F4F4F4; --ind: #2F7DE1; --pak: #0F8A4C;
  --display: "Outfit", ui-sans-serif, system-ui, sans-serif;
  --body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --mock: 32px; --stage-h: 100svh; --side-w: 384px; --gut: 32px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; padding-top: var(--mock); background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
body.still { --mock: 0px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .4; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.label { font: 600 .7rem/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
.glass {
  background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .015)), var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid var(--line); border-radius: 20px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 24px 64px -28px rgba(0, 0, 0, .7);
}
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 44px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--line); background: rgba(255, 255, 255, .04); font: 500 .95rem/1 var(--body); transition: background .2s, border-color .2s, transform .2s; }
.btn:hover:not(:disabled) { background: rgba(255, 255, 255, .09); border-color: var(--line-hi); }
.btn.primary { background: linear-gradient(180deg, #FFC56B, var(--amber-deep)); color: var(--on-amber); border-color: transparent; font-weight: 600;
  box-shadow: 0 10px 28px -10px rgba(245, 165, 36, .65), inset 0 1px 0 rgba(255, 255, 255, .45); }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #FFCF80, #FFAE33); }
.btn .arr { transition: transform .25s var(--ease); }
.btn:hover .arr { transform: translateX(3px); }
.btn.danger { color: var(--err); border-color: rgba(255, 107, 107, .35); background: transparent; }
.btn.sm { height: 30px; padding: 0 12px; font-size: .8rem; border-radius: 9px; }

/* Mockup-only state bar: not part of the product. */
#mock { position: fixed; top: 0; left: 0; right: 0; height: var(--mock); z-index: 50; display: flex; align-items: center; gap: 4px;
  padding: 0 12px; overflow-x: auto; scrollbar-width: none; background: #020308; border-bottom: 1px solid rgba(255, 255, 255, .06); font: 500 11px/1 var(--body); }
#mock b { color: var(--faint); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 10px; margin-right: 6px; }
#mock button { flex: none; background: none; border: 0; border-radius: 6px; padding: 5px 7px; color: var(--faint); white-space: nowrap; }
#mock button:hover { color: var(--fg); }
#mock button[aria-current="true"] { color: var(--amber); background: rgba(255, 181, 71, .1); }
#mock i { flex: none; width: 1px; height: 12px; background: rgba(255, 255, 255, .1); margin: 0 4px; }
body.still #mock { display: none; }

/* Top nav */
.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px var(--gut); }
.wordmark { font: 700 1.55rem/1 var(--display); letter-spacing: -.025em; border: 0; background: none; padding: 0; }
.wordmark i { font-style: normal; color: var(--amber); }
.links { display: flex; align-items: center; gap: 4px; }
.links button { border: 0; background: none; padding: 8px 12px; border-radius: 10px; font: 500 .9rem/1 var(--body); color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
.links button:hover { color: var(--fg); }
.links button[aria-current="page"] { color: var(--fg); background: rgba(255, 255, 255, .06); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 3px rgba(61, 220, 132, .18); }

/* Picker and About */
.page { position: relative; min-height: calc(100svh - var(--mock)); overflow: hidden; }
.page::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(60% 50% at 18% -10%, rgba(140, 170, 255, .16), transparent 70%),
              radial-gradient(50% 45% at 85% -5%, rgba(255, 196, 120, .10), transparent 70%); }
.page > * { position: relative; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 32px var(--gut) 48px; }
.eyebrow { margin: 0; color: var(--muted); font-size: 1.05rem; }
h1 { font: 600 clamp(2.5rem, 5.2vw, 4.25rem)/1 var(--display); letter-spacing: -.035em; margin: 14px 0 40px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
.card { position: relative; min-height: 400px; border-radius: 24px; overflow: hidden; border: 1px solid var(--line); background: #0A0E1A;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 30px 80px -40px rgba(0, 0, 0, .9); transition: transform .5s var(--ease), border-color .3s; }
.card:hover { transform: translateY(-3px); border-color: var(--line-hi); }
.card .art { position: absolute; inset: 0; }
.card .art svg { width: 100%; height: 100%; display: block; transition: transform 1.2s var(--ease); }
.card:hover .art svg { transform: scale(1.035); }
.card .art::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(6, 8, 15, .94) 0%, rgba(6, 8, 15, .72) 42%, rgba(6, 8, 15, .05) 78%); }
.card-body { position: relative; height: 100%; max-width: 64%; padding: 32px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { font: 600 2.1rem/1.05 var(--display); letter-spacing: -.025em; margin: 6px 0 0; }
.card .detail { margin: 0; color: var(--muted); font-size: .92rem; }
.card .result { margin: 6px 0 0; font: 600 1.15rem/1.3 var(--display); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: auto 0 8px; padding-top: 18px; color: var(--muted); font-size: .82rem; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta span + span::before { content: ""; width: 3px; height: 3px; border-radius: 50%; background: var(--faint); margin-right: 8px; }
.card .btn { align-self: flex-start; }
.card.ghost { min-height: 400px; background: linear-gradient(100deg, #0B0F1C 30%, #141a2c 50%, #0B0F1C 70%); background-size: 300% 100%; animation: shimmer 1.6s linear infinite; }
@keyframes shimmer { to { background-position: -150% 0; } }
.notice { padding: 32px; display: grid; gap: 18px; justify-items: start; font: 500 1.2rem/1.4 var(--display); max-width: 640px; }
.notice.err { border-color: rgba(255, 107, 107, .4); }
.status-line { color: var(--muted); margin: 0 0 16px; }
.foot { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--faint); font-size: .82rem; }
.about { max-width: 720px; display: grid; gap: 20px; font-size: 1.1rem; color: var(--muted); }
.about p { margin: 0; }
.about strong { color: var(--fg); font-weight: 500; }

/* Live page: the video stage is a fixed layer (#video) under the overlays, so its drift never restarts. */
#video { position: absolute; top: var(--mock); left: 0; right: 0; height: var(--stage-h); overflow: hidden; background: #03050A; z-index: 0; }
#video svg { width: 100%; height: 100%; display: block; animation: drift 28s ease-in-out infinite alternate; transform-origin: 60% 60%; }
#video.dim svg { opacity: .45; filter: saturate(.6); transition: opacity .4s; }
#video.off svg { display: none; }
@keyframes drift { to { transform: scale(1.06) translate(-1%, -.5%); } }
.live { position: relative; z-index: 1; }
.stage { position: relative; height: var(--stage-h); }
.shade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 8, 15, .78) 0%, rgba(6, 8, 15, 0) 24%, rgba(6, 8, 15, 0) 46%, rgba(6, 8, 15, .9) 100%),
              radial-gradient(120% 90% at 40% 50%, transparent 55%, rgba(0, 0, 0, .5)); }
.live .nav { position: absolute; top: 0; left: 0; right: 0; z-index: 3; }
.lane { position: absolute; left: var(--gut); right: calc(var(--side-w) + var(--gut) + 16px); z-index: 2; }
.hud { top: 84px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.scorebar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-radius: 14px; font: 600 1.05rem/1 var(--display); flex-wrap: wrap; }
.team { display: inline-flex; align-items: center; gap: 8px; letter-spacing: .02em; }
.team i { width: 6px; height: 22px; border-radius: 3px; background: var(--c); box-shadow: 0 0 12px var(--c); }
.score { font-size: 1.5rem; letter-spacing: -.01em; }
.sep { width: 1px; height: 20px; background: var(--line-hi); }
.clock { color: var(--amber); font-size: 1.15rem; }
.period { color: var(--muted); font: 500 .85rem/1 var(--body); }
.need { color: var(--fg); font: 600 .85rem/1 var(--body); padding: 6px 10px; border-radius: 8px; background: rgba(255, 181, 71, .14); border: 1px solid rgba(255, 181, 71, .3); }
.replay { font: 600 .65rem/1 var(--body); letter-spacing: .18em; color: var(--muted); border: 1px solid var(--line-hi); border-radius: 6px; padding: 5px 7px; }
.onair { display: inline-flex; align-items: center; gap: 10px; padding: 9px 14px 9px 12px; border-radius: 999px; font: 600 .7rem/1 var(--body); letter-spacing: .16em; }
.onair .rec { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, .3); }
.onair.on .rec { background: var(--air); animation: rec 1.4s ease-out infinite; }
@keyframes rec { 0% { box-shadow: 0 0 0 0 rgba(255, 77, 79, .6); } 100% { box-shadow: 0 0 0 10px rgba(255, 77, 79, 0); } }
.onair .who { letter-spacing: 0; text-transform: none; font-weight: 500; font-size: .8rem; color: var(--muted); }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.bars span { width: 3px; height: 4px; background: var(--amber); border-radius: 1px; }
.onair.on .bars span { animation: eq .55s ease-in-out infinite alternate; }
.onair.on .bars span:nth-child(2) { animation-delay: .18s; } .onair.on .bars span:nth-child(3) { animation-delay: .36s; } .onair.on .bars span:nth-child(4) { animation-delay: .1s; }
@keyframes eq { to { height: 14px; } }
.subtitle { bottom: 150px; display: grid; justify-items: center; gap: 16px; text-align: center; }
.subtitle .tag { font: 600 .7rem/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--amber); padding: 7px 11px; border-radius: 999px;
  background: rgba(255, 181, 71, .1); border: 1px solid rgba(255, 181, 71, .28); }
.subtitle .tag.fixed { color: var(--fix); background: rgba(124, 212, 255, .1); border-color: rgba(124, 212, 255, .3); }
.subtitle .tag.rejected { color: var(--err); background: rgba(255, 107, 107, .1); border-color: rgba(255, 107, 107, .3); }
.subtitle p { margin: 0; max-width: 24ch; font: 600 clamp(1.6rem, 3.3vw, 3.3rem)/1.1 var(--display); letter-spacing: -.02em; text-wrap: balance;
  text-shadow: 0 2px 30px rgba(0, 0, 0, .65); animation: rise .38s var(--ease); }
.subtitle.fixed p { color: var(--fix); }
.subtitle.rejected p { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 2px; }
.subtitle.waiting p { font: 500 1.15rem/1.4 var(--body); color: var(--muted); letter-spacing: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } }
.dock { bottom: 70px; display: flex; justify-content: center; }
.dock .glass { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 16px; flex-wrap: wrap; justify-content: center; }
.dock .btn { height: 38px; border-color: transparent; background: none; font-size: .88rem; }
.dock .btn:hover:not(:disabled) { background: rgba(255, 255, 255, .07); border-color: transparent; }
.seg { display: inline-flex; background: rgba(255, 255, 255, .05); border-radius: 12px; padding: 3px; }
.seg button { height: 32px; padding: 0 16px; border: 0; background: none; border-radius: 9px; color: var(--muted); font: 500 .88rem/1 var(--body); transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: rgba(255, 255, 255, .13); color: var(--fg); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1); }
.timeline { bottom: 26px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; font: 500 .72rem/1 var(--body); color: var(--faint); }
.track { position: relative; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .14); }
.track .played { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: rgba(255, 255, 255, .7); transition: width .6s var(--ease); }
.track .mk { position: absolute; top: 50%; width: 7px; height: 7px; border-radius: 50%; transform: translate(-50%, -50%); background: rgba(255, 255, 255, .3); }
.track .mk.done { background: var(--amber); box-shadow: 0 0 10px rgba(255, 181, 71, .7); }
.yt { display: inline-flex; align-items: center; gap: 8px; }
.yt svg { width: 14px; height: 14px; }
.overlay { position: absolute; inset: 0; z-index: 4; display: grid; place-content: center; justify-items: center; gap: 18px; text-align: center; padding: 24px;
  background: rgba(6, 8, 15, .55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font: 500 1.35rem/1.3 var(--display); }
.overlay .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .15); border-top-color: var(--amber); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.novideo { position: absolute; top: 46%; left: var(--gut); right: calc(var(--side-w) + var(--gut) + 16px); transform: translateY(-50%); z-index: 1; text-align: center; color: var(--faint); font-size: .95rem; }
.banner { position: absolute; top: 148px; left: var(--gut); right: calc(var(--side-w) + var(--gut) + 16px); z-index: 3; display: flex; justify-content: center; }
.banner > div { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-radius: 14px; font: 500 .92rem/1.3 var(--body); }
.banner .warn { border-color: rgba(255, 181, 71, .45); }
.banner .err { border-color: rgba(255, 107, 107, .5); }
.banner b { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.banner .warn b { background: var(--amber); animation: rec 1.4s ease-out infinite; }
.banner .err b { background: var(--err); }

.side { position: absolute; top: 84px; right: var(--gut); bottom: 26px; width: var(--side-w); z-index: 2; display: flex; flex-direction: column; gap: 16px; }
.panel { padding: 20px; }
.panel.lines { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.panel h3 { margin: 0; font: 600 1.05rem/1 var(--display); letter-spacing: -.01em; }
.panel .hint { margin: 0; color: var(--faint); font-size: .85rem; }
.log { list-style: none; margin: 0 -6px; padding: 0 6px; display: grid; gap: 4px; overflow: auto; min-height: 0; scrollbar-width: thin; }
.log li { display: grid; grid-template-columns: 52px 1fr auto; gap: 4px 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.log li:first-child { border-top: 0; padding-top: 2px; }
.log li.new .text > span:first-child { animation: rise .38s var(--ease); }
.log .when { font: 600 .8rem/1.55 var(--display); color: var(--amber); }
.log .text { min-width: 0; font-size: .92rem; line-height: 1.45; }
.log .orig { color: var(--faint); text-decoration: line-through; font-size: .82rem; margin-top: 4px; }
.log .meta-l { grid-column: 2; display: flex; gap: 8px; align-items: center; font-size: .72rem; color: var(--faint); }
.log .fixed .text > span:first-child { color: var(--fix); }
.log .rejected .text > span:first-child { color: var(--faint); text-decoration: line-through; }
.log .btn.sm { grid-column: 3; grid-row: 1; }
.pill { font: 600 .62rem/1 var(--body); letter-spacing: .14em; text-transform: uppercase; border-radius: 5px; padding: 4px 6px; }
.pill.fixed { color: #06202d; background: var(--fix); }
.pill.rejected { color: #2a0808; background: var(--err); }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px 12px; margin: 0; }
.stats div { display: grid; gap: 8px; align-content: start; }
.stats dd { margin: 0; font: 600 1.45rem/1 var(--display); letter-spacing: -.02em; }
.stats .wide { grid-column: 1 / -1; padding-top: 14px; border-top: 1px solid var(--line); }
.stats .wide dd { font: 500 .95rem/1.4 var(--body); letter-spacing: 0; }
.stats .wide dd.good::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin-right: 8px; vertical-align: 1px; }
.panel .small { margin: 14px 0 0; font-size: .75rem; color: var(--faint); line-height: 1.45; }
.err-text { color: var(--err); }

/* Sheets: producer fix and voice setting */
.scrim { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(3, 5, 10, .55);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: min(580px, 100%); padding: 28px; border-radius: 24px; display: grid; gap: 16px; animation: lift .32s var(--ease); background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02)), rgba(12, 16, 28, .82); }
@keyframes lift { from { opacity: 0; transform: translateY(16px) scale(.98); } }
.sheet h2 { margin: 0; font: 600 1.6rem/1.1 var(--display); letter-spacing: -.02em; }
.sheet .lede { margin: -6px 0 0; color: var(--muted); font-size: .92rem; }
.said { font: 500 1.1rem/1.4 var(--display); padding: 14px 16px; border-radius: 14px; background: rgba(255, 107, 107, .07); border: 1px solid rgba(255, 107, 107, .22); }
.field { display: grid; gap: 8px; }
.sheet textarea { width: 100%; min-height: 6rem; resize: vertical; padding: 14px 16px; border-radius: 14px; background: rgba(0, 0, 0, .3); color: var(--fg);
  border: 1px solid var(--line-hi); font: 500 1.1rem/1.4 var(--display); }
.sheet textarea:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 4px rgba(255, 181, 71, .15); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; }
.chips span { display: inline-block; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: .85rem; color: var(--muted); transition: all .2s; }
.chips input:checked + span { color: var(--fg); border-color: var(--amber); background: rgba(255, 181, 71, .1); }
.chips input:focus-visible + span { outline: 2px solid var(--amber); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions .spacer { flex: 1; }
.sheet .hint { margin: 0; font-size: .8rem; color: var(--faint); }
.voices { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt { position: relative; display: block; }
.opt input { position: absolute; opacity: 0; }
.opt span { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); font-size: .9rem; color: var(--muted); transition: all .2s; }
.opt span::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; }
.opt input:checked + span { color: var(--fg); border-color: rgba(255, 181, 71, .55); background: rgba(255, 181, 71, .08); }
.opt input:checked + span::before { border-color: var(--amber); background: radial-gradient(circle, var(--amber) 0 4px, transparent 5px); }
.opt input:focus-visible + span { outline: 2px solid var(--amber); outline-offset: 2px; }
.opt input:disabled + span { opacity: .45; }
.opt em { margin-left: auto; font: 600 .6rem/1 var(--body); font-style: normal; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); }
.switch { width: 46px; height: 28px; border-radius: 999px; border: 0; background: rgba(255, 255, 255, .16); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); }
.switch[aria-checked="true"] { background: var(--amber-deep); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 30; padding: 12px 18px; border-radius: 999px; font-weight: 500; font-size: .92rem; animation: lift .3s var(--ease); }

/* Tablet: the panels move under the stage. */

<body>

<script>
// Fake data. Moments and scores follow the real matches; video times and lines are samples, not the agent's output.
const MATCHES = {

        text: "Kohli goes straight back over Rauf's head! Six! India need 22 off 7!" },

        text: "And again! Flicked over fine leg! Sixteen needed off the last over!" },
      { clock: "19.1", period: "2nd innings", score: "144/5", need: "need 16 off 5", vt: 182, ms: 650, mark: "Wicket",
        text: "Pandya goes! Caught off Nawaz, first ball of the last over!" },
      { clock: "19.4", period: "2nd innings", score: "154/5", need: "need 6 off 3", vt: 221, ms: 610, mark: "No-ball · Six",
        text: "Full toss, waist high, and Kohli dispatches it for six! No-ball, free hit!" },
      { clock: "19.6", period: "2nd innings", score: "160/6", need: "India win", vt: 260, ms: 570, mark: "India win",
        text: "Ashwin lifts it over mid-off! India win it off the very last ball!" },
    ],
  },
};
const REASONS = ["Wrong fact", "Wrong player", "Wrong score", "Tone", "Other"];
const VOICES = { British: "en-GB", Indian: "en-IN", Australian: "en-AU" };
const DEFAULT_VOICE = { football: "British", cricket: "Indian" };
const hasSpeech = "speechSynthesis" in window;

const fresh = () => ({ screen: "picker", picker: "ok", sport: "football", idx: -1, live: "ok", video: "ok", stream: "ok",
  voice: "on", voices: { ...DEFAULT_VOICE }, speaking: false, sheet: null, fix: null, fixes: {}, proof: "ok", adapter: "result", toast: "" });
let S = fresh();
let timer = null;

// Mockup states: each one is a URL hash, so a reviewer can link straight to it.
const better = MATCHES.football.moments[3].better;
const PRESETS = {
  "Picker": {}, "Picker loading": { picker: "loading" }, "Picker empty": { picker: "empty" }, "Picker error": { picker: "error" }, "About": { screen: "about" },
  "|1": 0,
  "Live football": { screen: "live", idx: 1, speaking: true }, "Live cricket": { screen: "live", sport: "cricket", idx: 3, speaking: true },
  "Starting": { screen: "live", live: "starting" }, "Video loading": { screen: "live", video: "loading" }, "Waiting": { screen: "live", idx: -1 },
  "Video unavailable": { screen: "live", idx: 1, video: "unavailable" }, "Replay error": { screen: "live", live: "error" },
  "Sport switch": { screen: "live", sport: "cricket", live: "switching" },
  "Reconnecting": { screen: "live", idx: 2, stream: "reconnecting" }, "Disconnected": { screen: "live", idx: 2, stream: "disconnected" },
  "|2": 0,
  "Voice setting": { screen: "live", sport: "cricket", idx: 3, sheet: "voice" }, "Speaking": { screen: "live", idx: 1, speaking: true },
  "Voice off": { screen: "live", idx: 3, voice: "off" }, "Voice unavailable": { screen: "live", idx: 3, voice: "unavailable" },
  "|3": 0,
  "Fix sheet": { screen: "live", idx: 3, fix: { key: "football-3", phase: "edit" } },
  "Fix empty": { screen: "live", idx: 3, fix: { key: "football-3", phase: "edit", text: "" } },
  "Fix sending": { screen: "live", idx: 3, fix: { key: "football-3", phase: "sending", text: better } },
  "Fix error": { screen: "live", idx: 3, fix: { key: "football-3", phase: "error", text: better } },
  "Line fixed": { screen: "live", idx: 3, fixes: { "football-3": { text: better, reason: "Wrong fact" } } },
  "Line rejected": { screen: "live", idx: 3, fixes: { "football-3": { rejected: true } } },
  "|4": 0,
  "Proof empty": { screen: "live", idx: -1, proof: "empty" }, "Proof loading": { screen: "live", idx: 1, proof: "loading" },
  "Proof error": { screen: "live", idx: 1, proof: "error" }, "Adapter not trained": { screen: "live", idx: 3, adapter: "untrained" },
  "Adapter training": { screen: "live", idx: 3, adapter: "training" }, "Adapter cost not measurable": { screen: "live", idx: 3, adapter: "nocost" },
};
const slug = (name) => name.toLowerCase().replace(/ /g, "-");

function applyHash() {
  clearTimeout(timer);
  if (hasSpeech) speechSynthesis.cancel();
  const name = Object.keys(PRESETS).find((k) => slug(k) === decodeURIComponent(location.hash.slice(1)));
  S = Object.assign(fresh(), name ? JSON.parse(JSON.stringify(PRESETS[name])) : {});
  render();
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const set = (patch) => { Object.assign(S, patch); render(); };
const key = (sport, i) => `${sport}-${i}`;
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

// ---- Artwork: our own SVG. A night stadium stands in for the YouTube player; kit shirts stand in for player art. ----
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function stadium({ id, w, h, sport, seed, figures = [], extra = "" }) {
  const R = rng(seed), hz = h * .47, ph = h - hz;
  let s = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>
    <linearGradient id="${id}s" x2="0" y2="1"><stop offset="0" stop-color="#0B1736"/><stop offset="1" stop-color="#04060C"/></linearGradient>
    <radialGradient id="${id}g"><stop offset="0" stop-color="#F4F8FF" stop-opacity=".95"/><stop offset=".12" stop-color="#C9DAFF" stop-opacity=".4"/><stop offset="1" stop-color="#9DB8FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="${id}b" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="${id}p" x2="0" y2="1"><stop offset="0" stop-color="#1D6A3D"/><stop offset=".55" stop-color="#145430"/><stop offset="1" stop-color="#0A2E1B"/></linearGradient>
    <linearGradient id="${id}l" x2="1"><stop offset="0" stop-color="#FFB547"/><stop offset=".5" stop-color="#5B8CFF"/><stop offset="1" stop-color="#FFB547"/></linearGradient>
    <linearGradient id="${id}t" x2="0" y2="1"><stop offset="0" stop-color="#B89A6A"/><stop offset="1" stop-color="#D9BC8A"/></linearGradient>
  </defs><rect width="${w}" height="${h}" fill="url(#${id}s)"/>`;
  for (const fx of [.07, .3, .7, .93]) {
    const cx = w * fx, cy = h * .075;
    s += `<polygon points="${cx - 8},${cy} ${cx + 8},${cy} ${cx + w * .1 * (fx < .5 ? 1.4 : .6)},${hz + ph * .5} ${cx - w * .1 * (fx < .5 ? .6 : 1.4)},${hz + ph * .5}" fill="url(#${id}b)"/>
      <circle cx="${cx}" cy="${cy}" r="${w * .17}" fill="url(#${id}g)" opacity=".7"/>`;
    for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) s += `<rect x="${cx - 14 + c * 7.5}" y="${cy - 6 + r * 7}" width="5" height="5" rx="1" fill="#fff"/>`;
  }
  const roof = (x) => h * .21 - h * .07 * 4 * (x / w) * (1 - x / w);
  s += `<path d="M0 ${h * .21} Q${w / 2} ${h * .07} ${w} ${h * .21} L${w} ${hz} L0 ${hz} Z" fill="#0A1020"/>`;
  for (const k of [.3, .55, .8]) s += `<path d="M0 ${h * .21 + (hz - h * .21) * k} Q${w / 2} ${h * .07 + (hz - h * .07) * k} ${w} ${h * .21 + (hz - h * .21) * k}" stroke="#fff" stroke-opacity=".05" fill="none"/>`;
  const crowd = ["#FFFFFF", "#FFE2B0", "#A9C6FF", "#FFB547", ...(sport === "football" ? ["#E8414C", "#FFFFFF"] : ["#4FA3FF", "#2FBF71"])];
  for (let i = 0; i < (w > 1000 ? 520 : 260); i++) {
    const x = R() * w, top = roof(x) + 10, y = top + R() * (hz - top - 14);
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(.7 + R() * 2.1).toFixed(2)}" fill="${crowd[(R() * crowd.length) | 0]}" opacity="${(.1 + R() * .45).toFixed(2)}"/>`;
  }
  s += `<rect y="${hz - h * .026}" width="${w}" height="${h * .022}" fill="url(#${id}l)" opacity=".45"/>
    <rect y="${hz}" width="${w}" height="${ph}" fill="url(#${id}p)"/>`;
  for (let i = 0; i < 10; i += 2) {
    const y0 = hz + ph * (i / 10) ** 1.5, y1 = hz + ph * ((i + 1) / 10) ** 1.5;
    s += `<rect y="${y0}" width="${w}" height="${y1 - y0}" fill="#fff" opacity=".035"/>`;
  }
  if (sport === "football") {
    s += `<g stroke="#fff" stroke-opacity=".45" stroke-width="${w / 800}" fill="none">
      <line x1="0" y1="${hz + 5}" x2="${w}" y2="${hz + 5}"/><line x1="${w * .5}" y1="${hz + 5}" x2="${w * .43}" y2="${h}"/>
      <ellipse cx="${w * .475}" cy="${hz + ph * .42}" rx="${w * .15}" ry="${ph * .17}"/>
      <path d="M${w} ${hz + ph * .1} L${w * .86} ${hz + ph * .1} L${w * .8} ${hz + ph * .62} L${w} ${hz + ph * .62}"/></g>`;
  } else {
    const t = hz + ph * .2, b = hz + ph * .8, cx = w * .5;
    s += `<ellipse cx="${cx}" cy="${hz + ph * .56}" rx="${w * .66}" ry="${ph * .62}" stroke="#fff" stroke-opacity=".3" fill="none" stroke-width="${w / 600}"/>
      <ellipse cx="${cx}" cy="${hz + ph * .5}" rx="${w * .3}" ry="${ph * .36}" stroke="#fff" stroke-opacity=".18" stroke-dasharray="6 8" fill="none"/>
      <polygon points="${cx - w * .018},${t} ${cx + w * .018},${t} ${cx + w * .04},${b} ${cx - w * .04},${b}" fill="url(#${id}t)" opacity=".85"/>
      <g stroke="#fff" stroke-opacity=".8" stroke-width="${w / 900}"><line x1="${cx - w * .03}" y1="${t + ph * .04}" x2="${cx + w * .03}" y2="${t + ph * .04}"/><line x1="${cx - w * .055}" y1="${b - ph * .07}" x2="${cx + w * .055}" y2="${b - ph * .07}"/></g>
      <g fill="#F2E6CC">${[-1, 0, 1].map((k) => `<rect x="${cx + k * w * .004 - 1}" y="${t - ph * .03}" width="2" height="${ph * .03}"/><rect x="${cx + k * w * .007 - 1.5}" y="${b - ph * .1}" width="3" height="${ph * .05}"/>`).join("")}</g>`;
  }
  for (const [fx, fy, body, shorts] of figures) {
    const x = w * fx, y = hz + ph * fy, z = h * (.022 + .05 * fy);
    s += `<ellipse cx="${x}" cy="${y}" rx="${z * .5}" ry="${z * .1}" fill="#000" opacity=".4"/>
      <rect x="${x - z * .16}" y="${y - z * .62}" width="${z * .12}" height="${z * .62}" rx="${z * .05}" fill="${shorts}"/><rect x="${x + z * .04}" y="${y - z * .62}" width="${z * .12}" height="${z * .62}" rx="${z * .05}" fill="${shorts}"/>
      <rect x="${x - z * .27}" y="${y - z * 1.42}" width="${z * .54}" height="${z * .86}" rx="${z * .14}" fill="${body}"/>
      <circle cx="${x}" cy="${y - z * 1.62}" r="${z * .19}" fill="#2B1D16"/>`;
  }
  return s + extra + `</svg>`;
}

function shirt(x, y, scale, rot, fill, trim, label, ink, size) {
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${scale})">
    <ellipse cx="100" cy="120" rx="150" ry="130" fill="${fill}" opacity=".22" filter="blur(28px)"/>
    <path d="M62 12 L82 4 Q100 22 118 4 L138 12 L192 42 L172 92 L150 80 L150 212 Q100 222 50 212 L50 80 L28 92 L8 42 Z" fill="${fill}"/>
    <path d="M62 12 L82 4 Q100 22 118 4 L138 12 L192 42 L172 92 L150 80 L150 212 Q100 222 50 212 L50 80 L28 92 L8 42 Z" fill="url(#shade)"/>
    <path d="M82 4 Q100 22 118 4" stroke="${trim}" stroke-width="5" fill="none"/>
    <path d="M10 46 L28 54 M190 46 L172 54" stroke="${trim}" stroke-width="4"/>
    <text x="100" y="${size > 60 ? 150 : 132}" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="700" font-size="${size}" fill="${ink}" letter-spacing="-2">${label}</text></g>`;
}
const SHADE = `<defs><linearGradient id="shade" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient></defs>`;
const ART = {
  football: stadium({ id: "cf", w: 800, h: 500, sport: "football", seed: 11, extra: SHADE
    + shirt(430, 170, 1.15, -8, "#C8102E", "#F1BF00", "10", "#F1BF00", 96) + shirt(590, 190, 1.15, 7, "#F4F4F4", "#1B2A5A", "9", "#1B2A5A", 96) }),
  cricket: stadium({ id: "cc", w: 800, h: 500, sport: "cricket", seed: 23, extra: SHADE
    + shirt(600, 175, 1.15, 7, "#0F8A4C", "#D9F2E4", "PAK", "#F4F4F4", 44) + shirt(440, 160, 1.15, -8, "#2F7DE1", "#FF9933", "IND", "#F4F4F4", 44)
    + `<circle cx="720" cy="430" r="17" fill="#B3262E"/><path d="M706 422 Q720 432 734 422" stroke="#F4D9C0" stroke-width="2" fill="none"/>` }),
};
const STAGE = {
  football: () => stadium({ id: "sf", w: 1600, h: 900, sport: "football", seed: 5, figures: [
    [.83, .36, "#F4D03F", "#222"], [.7, .45, "#C8102E", "#1B2A5A"], [.63, .55, "#F4F4F4", "#1B2A5A"], [.76, .6, "#C8102E", "#1B2A5A"],
    [.57, .7, "#C8102E", "#1B2A5A"], [.68, .78, "#F4F4F4", "#1B2A5A"], [.47, .62, "#F4F4F4", "#1B2A5A"], [.88, .7, "#F4F4F4", "#1B2A5A"], [.38, .82, "#C8102E", "#1B2A5A"]],
    extra: `<circle cx="${1600 * .65}" cy="${900 * .47 + 477 * .57}" r="7" fill="#fff"/>` }),
  cricket: () => stadium({ id: "sc", w: 1600, h: 900, sport: "cricket", seed: 9, figures: [
    [.5, .14, "#0F8A4C", "#0F8A4C"], [.505, .7, "#2F7DE1", "#1E4FA0"], [.5, .86, "#0F8A4C", "#0F8A4C"], [.47, .24, "#2F7DE1", "#1E4FA0"],
    [.25, .45, "#0F8A4C", "#0F8A4C"], [.78, .38, "#0F8A4C", "#0F8A4C"], [.15, .78, "#0F8A4C", "#0F8A4C"], [.86, .74, "#0F8A4C", "#0F8A4C"], [.56, .26, "#EDEDED", "#333"]] }),
};
const stageCache = {};

// ---- Views ----
function nav(current) {
  const link = (act, label, cur, extra = "") => `<button data-act="${act}" ${cur ? 'aria-current="page"' : ""}>${extra}${label}</button>`;
  return `<header class="nav"><button class="wordmark" data-act="fixtures" aria-label="Touchline, home">Touchline<i>.</i></button>
    <nav class="links" aria-label="Main">${link("live", "Live", current === "live", '<span class="dot" aria-hidden="true"></span>')}${link("fixtures", "Fixtures", current === "picker")}${link("about", "About", current === "about")}</nav></header>`;
}

function pickerView() {
  let body;
  if (S.picker === "loading") body = `<p class="status-line" role="status">Loading matches…</p><div class="cards"><div class="card ghost"></div><div class="card ghost"></div></div>`;
  else if (S.picker === "empty") body = `<div class="notice glass">No matches yet. Load the demo data, then refresh.</div>`;
  else if (S.picker === "error") body = `<div class="notice glass err" role="alert">Couldn't load matches. Is the server running?
    <button class="btn" data-act="picker-retry">Try again</button></div>`;
  else body = `<div class="cards">${["football", "cricket"].map((sp) => {
    const m = MATCHES[sp];
    return `<article class="card"><div class="art">${ART[sp]}</div><div class="card-body">
      <span class="label">${m.sport}</span><h2>${m.title}</h2><p class="detail">${m.detail}</p><p class="result">${m.result}</p>
      <div class="meta"><span class="num">Highlights ${mmss(m.length)}</span><span>${m.moments.length} key moments</span><span>${DEFAULT_VOICE[sp]} commentator</span></div>
      <button class="btn primary" data-act="start" data-sport="${sp}">Start replay <span class="arr" aria-hidden="true">→</span></button></div></article>`;
  }).join("")}</div>`;
  return `<div class="page">${nav("picker")}<main class="wrap"><p class="eyebrow">A live AI commentator for matches nobody calls.</p>
    <h1>Pick a match</h1>${body}<p class="foot">Match data: StatsBomb open data and Cricsheet. Highlights: the competitions' official YouTube channels. Commentary is AI-generated.</p></main></div>`;
}

function aboutView() {
  return `<div class="page">${nav("about")}<main class="wrap"><p class="eyebrow">About Touchline</p><h1>Every match deserves a commentator.</h1>
    <div class="about"><p><strong>Most matches are played with nobody calling them.</strong> Touchline watches a match's event feed and calls each key moment in one emotional spoken line, about a second after it happens, over the official highlights.</p>
    <p><strong>One commentator, two sports.</strong> The same agent calls football and cricket; switch sport and it follows.</p>
    <p><strong>It learns from its producer.</strong> A wrong line is fixed in one tap. Every call and every fix goes through Mubit, which trains a smaller commentator that matches the big one at lower cost.</p></div>
    <p class="foot">Match data: StatsBomb open data and Cricsheet. Commentary is AI-generated.</p></main></div>`;
}

function liveView() {
  const match = MATCHES[S.sport], ok = S.live === "ok";
  const m = ok ? match.moments[S.idx] : null;
  const [[h, hc], [a, ac]] = match.teams;
  const team = (code, c) => `<span class="team" style="--c:${c}"><i></i>${code}</span>`;
  const bar = S.sport === "football"
    ? `${team(h, hc)}<span class="score num">${m ? m.score : "0–0"}</span>${team(a, ac)}<span class="sep"></span>
       <span class="clock num">${m ? m.clock : "00:00"}</span><span class="period">${m ? m.period : "1st half"}</span>`
    : `${team(h, hc)}<span class="score num">${m ? m.score : "0/0"}</span><span class="sep"></span>
       <span class="clock num">Over ${m ? m.clock : "0.0"}</span><span class="need num">${m ? m.need : "need 160 off 120"}</span>
       <span class="period">${team(a, ac)} <span class="num">159/8</span></span>`;
  const voiceName = `${S.voices[S.sport]} commentator`;
  const onair = S.voice === "on"
    ? `<span class="onair glass ${S.speaking ? "on" : ""}" role="status"><span class="rec"></span>ON AIR<span class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span class="who">${voiceName}</span></span>`
    : `<span class="onair glass"><span class="rec"></span>${S.voice === "off" ? "VOICE OFF" : "VOICE UNAVAILABLE"}<span class="who">${S.voice === "off" ? "Subtitles only" : "Subtitles carry on"}</span></span>`;

  let overlay = "";
  if (S.live === "starting") overlay = `<div class="overlay" aria-busy="true"><span class="spin"></span>Starting replay…</div>`;
  if (S.live === "switching") overlay = `<div class="overlay" aria-busy="true"><span class="spin"></span>Switching to ${S.sport}…<span class="label">${match.title} · ${voiceName}</span></div>`;
  if (ok && S.video === "loading") overlay = `<div class="overlay" aria-busy="true"><span class="spin"></span>Loading highlights…</div>`;
  if (S.live === "error") overlay = `<div class="overlay" role="alert"><span>Couldn't start the replay.</span><span class="actions">
    <button class="btn primary" data-act="retry">Try again</button><button class="btn" data-act="fixtures">Back to matches</button></span></div>`;
  const banner = S.stream === "reconnecting" ? `<div class="banner"><div class="glass warn" role="alert"><b></b>Reconnecting to the replay…</div></div>`
    : S.stream === "disconnected" ? `<div class="banner"><div class="glass err" role="alert"><b></b>Stream disconnected. Lines may be missing.
      <button class="btn sm" data-act="reconnect">Reconnect</button></div></div>` : "";
  const novideo = ok && S.video === "unavailable" ? `<p class="novideo">Highlights unavailable here. Commentary carries on.</p>` : "";

  let sub = "";
  if (ok && S.video !== "loading") {
    if (!m) sub = `<div class="lane subtitle waiting" aria-live="polite"><p>Waiting for the first moment…</p></div>`;
    else {
      const f = S.fixes[key(S.sport, S.idx)];
      const tag = `${S.sport === "cricket" ? "Over " : ""}${m.clock} · ${m.mark}`;
      if (f && f.rejected) sub = `<div class="lane subtitle rejected" aria-live="polite"><span class="tag rejected">Rejected</span><p>${esc(m.text)}</p></div>`;
      else if (f) sub = `<div class="lane subtitle fixed" aria-live="polite"><span class="tag fixed">Fixed · ${tag}</span><p>${esc(f.text)}</p></div>`;
      else sub = `<div class="lane subtitle" aria-live="polite"><span class="tag">${tag}</span><p>${esc(m.text)}</p></div>`;
    }
  }
  const busy = !ok;
  const dock = `<div class="lane dock"><div class="glass">
    <button class="btn" data-act="fixtures">← Fixtures</button>
    <div class="seg" role="group" aria-label="Sport">${["football", "cricket"].map((s) =>
      `<button data-act="sport" data-sport="${s}" aria-pressed="${S.sport === s}" ${busy ? "disabled" : ""}>${MATCHES[s].sport}</button>`).join("")}</div>
    <button class="btn" data-act="voice" ${busy ? "disabled" : ""} aria-haspopup="dialog">Voice: ${S.voice === "on" ? S.voices[S.sport] : S.voice === "off" ? "Off" : "Unavailable"}</button></div></div>`;
  const now = m ? m.vt : ok && S.video === "ok" ? 12 : 0;
  const timeline = `<div class="lane timeline"><span class="yt"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="3" width="14" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6.5 5.8v4.4L10.3 8z" fill="currentColor"/></svg>Official highlights · YouTube · muted</span>
    <div class="track" aria-hidden="true"><span class="played" style="width:${(now / match.length) * 100}%"></span>${match.moments.map((mo, i) =>
      `<span class="mk ${ok && i <= S.idx ? "done" : ""}" style="left:${(mo.vt / match.length) * 100}%"></span>`).join("")}</div>
    <span class="num">${mmss(now)} / ${mmss(match.length)}</span></div>`;

  return `<div class="live"><section class="stage" aria-label="${match.title} highlights"><div class="shade"></div>${nav("live")}
    <div class="lane hud"><div class="scorebar glass" role="status">${bar}<span class="replay">REPLAY</span></div>${onair}</div>
    ${novideo}${banner}${sub}${dock}${timeline}${overlay}</section>
    <aside class="side">${logView()}${proofView()}</aside></div>`;
}

function logView() {
  const ms = S.live === "ok" && S.video !== "loading" ? MATCHES[S.sport].moments.slice(0, S.idx + 1) : [];
  const head = `<div class="panel-h"><h3>Lines</h3><span class="label">${ms.length ? `${ms.length} called` : ""}</span></div>`;
  if (!ms.length) return `<section class="panel lines glass">${head}<p class="hint">Lines appear here as Touchline calls them.</p></section>`;
  const items = ms.map((m, i) => {
    const f = S.fixes[key(S.sport, i)];
    const cls = (f ? (f.rejected ? "rejected" : "fixed") : "") + (i === S.idx ? " new" : "");
    const text = f && !f.rejected ? `<span>${esc(f.text)}</span><div class="orig">${esc(m.text)}</div>` : `<span>${esc(m.text)}</span>`;
    const tag = f ? `<span class="pill ${f.rejected ? "rejected" : "fixed"}">${f.rejected ? "Rejected" : "Fixed"}</span>` : "";
    return `<li class="${cls}"><span class="when num">${m.clock}</span><div class="text">${text}</div>
      <button class="btn sm" data-act="fix" data-i="${i}" ${f ? "disabled" : ""} aria-label="Fix the line at ${m.clock}">Fix</button>
      <div class="meta-l"><span class="num">first word ${(m.ms / 1000).toFixed(2)} s</span>${tag}</div></li>`;
  }).reverse().join("");
  return `<section class="panel lines glass">${head}<ul class="log">${items}</ul></section>`;
}

function proofView() {
  const nFix = Object.keys(S.fixes).length;
  let body;
  if (S.proof === "loading") body = `<p class="hint" role="status">Loading stats…</p>`;
  else if (S.proof === "error") body = `<p class="err-text">Stats unavailable. Lines still play.</p>`;
  else {
    const empty = S.proof === "empty" || S.idx < 0 || S.live !== "ok";
    const v = (x) => (empty ? "–" : x);
    const adapter = empty ? "–"
      : S.adapter === "untrained" ? "Not trained yet: needs 25 kept lines (12 so far)."
      : S.adapter === "training" ? "Training: Mubit is building the adapter."
      : "Agrees with the big model on 23 of 25 test moments.";
    const nocost = S.adapter === "nocost" && !empty
      ? `<div class="wide"><dt class="label">Adapter cost</dt><dd>Not measurable. <span class="hint">Mubit doesn't report the adapter's cost to the app.</span></dd></div>` : "";
    body = `<dl class="stats">
      <div><dt class="label">First word p50</dt><dd class="num">${v("0.61 s")}</dd></div>
      <div><dt class="label">First word p95</dt><dd class="num">${v("1.04 s")}</dd></div>
      <div><dt class="label">Cost per line</dt><dd class="num">${v("$0.0009")}</dd></div>
      <div><dt class="label">Lines</dt><dd class="num">${v(37 + S.idx + 1)}</dd></div>
      <div><dt class="label">Fixes</dt><dd class="num">${v(2 + nFix)}</dd></div>
      <div class="wide"><dt class="label">Adapter</dt><dd class="${!empty && S.adapter === "result" ? "good" : ""}">${adapter}</dd></div>${nocost}
    </dl>${empty ? `<p class="small">No lines yet.</p>` : ""}
    <p class="small">First word: time from the moment to the first spoken word. Measured through Mubit.</p>`;
  }
  return `<section class="panel glass" aria-live="polite"><div class="panel-h"><h3>Proof</h3></div>${body}</section>`;
}

function fixView() {
  if (!S.fix) return "";
  const [sport, i] = S.fix.key.split("-");
  const m = MATCHES[sport].moments[+i];
  const text = S.fix.text ?? m.text;
  const sending = S.fix.phase === "sending";
  const reason = S.fix.reason || "Wrong fact";
  return `<div class="scrim" data-act="scrim"><div class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="fix-h">
    <h2 id="fix-h">Fix this line</h2>
    <div class="field"><span class="label">Touchline said</span><div class="said">${esc(m.text)}</div></div>
    <div class="field"><label class="label" for="fix-text">Corrected line</label><textarea id="fix-text" ${sending ? "disabled" : ""}>${esc(text)}</textarea>
    ${text.trim() ? "" : `<p class="hint">Type the corrected line, or reject it.</p>`}</div>
    <div class="field"><span class="label">What was wrong</span>
    <div class="chips" role="radiogroup" aria-label="What was wrong">${REASONS.map((r) =>
      `<label><input type="radio" name="reason" value="${r}" ${r === reason ? "checked" : ""} ${sending ? "disabled" : ""}><span>${r}</span></label>`).join("")}</div></div>
    ${S.fix.phase === "error" ? `<p class="err-text" role="alert">Fix not saved. Check the connection and send again.</p>` : ""}
    <div class="actions">
      <button class="btn primary" data-act="send" ${sending || !text.trim() ? "disabled" : ""}>${sending ? '<span class="spin" style="width:16px;height:16px"></span>Sending fix…' : "Send fix"}</button>
      <button class="btn danger" data-act="reject" ${sending ? "disabled" : ""}>Reject line</button>
      <span class="spacer"></span><button class="btn" data-act="cancel" ${sending ? "disabled" : ""}>Cancel</button></div>
    <p class="hint">Your fix goes back through Mubit and is kept beside the original.</p></div></div>`;
}

function voiceView() {
  if (S.sheet !== "voice") return "";
  const off = S.voice !== "on";
  const group = (sp) => `<div role="radiogroup" aria-label="${MATCHES[sp].sport} voice"><span class="label">${MATCHES[sp].sport}</span><div class="opts">${Object.keys(VOICES).map((v) =>
    `<label class="opt"><input type="radio" name="voice-${sp}" value="${v}" data-sport="${sp}" ${S.voices[sp] === v ? "checked" : ""} ${off ? "disabled" : ""}>
     <span>${v} commentator${DEFAULT_VOICE[sp] === v ? "<em>Default</em>" : ""}</span></label>`).join("")}</div></div>`;
  return `<div class="scrim" data-act="scrim"><div class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="voice-h">
    <h2 id="voice-h">Commentator voice</h2>
    <p class="lede">Each line is spoken in this voice. A change applies from the next line, without reloading.</p>
    ${S.voice === "unavailable" ? `<p class="err-text" role="alert">Voice unavailable. Subtitles carry on.</p>`
      : `<div class="toggle"><span>Voice</span><button class="switch" role="switch" aria-checked="${S.voice === "on"}" aria-label="Voice" data-act="voice-toggle"></button></div>`}
    <div class="voices">${group("football")}${group("cricket")}</div>
    <div class="actions"><span class="spacer"></span><button class="btn primary" data-act="close">Done</button></div></div></div>`;
}

function mockBar() {
  const cur = decodeURIComponent(location.hash.slice(1));
  return `<b>Mockup</b>` + Object.keys(PRESETS).map((k) => k.startsWith("|") ? "<i></i>"
    : `<button data-preset="${slug(k)}" aria-current="${cur === slug(k)}">${k}</button>`).join("");
}

function render() {
  document.getElementById("mock").innerHTML = mockBar();
  const v = document.getElementById("video");
  v.hidden = S.screen !== "live";
  if (!v.hidden && v.dataset.sport !== S.sport) { v.innerHTML = stageCache[S.sport] ??= STAGE[S.sport](); v.dataset.sport = S.sport; }
  v.className = S.video === "unavailable" && S.live === "ok" ? "off" : S.stream !== "ok" || S.live !== "ok" || S.video === "loading" ? "dim" : "";
  const app = document.getElementById("app");
  app.innerHTML = (S.screen === "picker" ? pickerView() : S.screen === "about" ? aboutView() : liveView())
    + fixView() + voiceView() + (S.toast ? `<div class="toast glass" role="status">${S.toast}</div>` : "");
  if (S.fix) document.getElementById("fix-text")?.focus();
}

// ---- Playback (mockup only: a timer stands in for the video clock and the SSE stream) ----
function speak(text) {
  S.speaking = true;
  if (S.voice === "on" && hasSpeech) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text), lang = VOICES[S.voices[S.sport]];
    u.lang = lang; u.rate = 1.08; u.pitch = 1.1;
    u.voice = speechSynthesis.getVoices().find((x) => x.lang.replace("_", "-") === lang) || null;
    u.onend = () => set({ speaking: false });
    speechSynthesis.speak(u);
  } else setTimeout(() => set({ speaking: false }), 2600);
}
function step() {
  const ms = MATCHES[S.sport].moments;
  if (S.screen !== "live" || S.live !== "ok" || S.idx >= ms.length - 1) return;
  S.idx += 1;
  speak(ms[S.idx].text);
  render();
  timer = setTimeout(step, 5200);
}
function start(sport, switching) {
  clearTimeout(timer);
  if (hasSpeech) speechSynthesis.cancel();
  history.replaceState(null, "", location.pathname + location.search);
  Object.assign(S, { screen: "live", sport, idx: -1, live: switching ? "switching" : "starting", video: "ok", stream: "ok", speaking: false, fix: null, sheet: null, proof: "ok" });
  render();
  timer = setTimeout(() => { set({ live: "ok" }); timer = setTimeout(step, 1400); }, 1000);
}
function toast(msg) { set({ toast: msg }); setTimeout(() => set({ toast: "" }), 2400); }

document.addEventListener("click", (e) => {
  const p = e.target.closest("[data-preset]");
  if (p) { location.hash = p.dataset.preset; return; }
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  const act = t.dataset.act;
  if (act === "scrim" && e.target !== t) return;
  if (act === "start") start(t.dataset.sport);
  else if (act === "sport") { if (t.dataset.sport !== S.sport) start(t.dataset.sport, true); }
  else if (act === "live") start(S.sport);
  else if (act === "fixtures" || act === "about") { clearTimeout(timer); if (hasSpeech) speechSynthesis.cancel(); history.replaceState(null, "", location.pathname + location.search); set({ ...fresh(), screen: act === "about" ? "about" : "picker" }); }
  else if (act === "picker-retry") { set({ picker: "loading" }); setTimeout(() => set({ picker: "ok" }), 900); }
  else if (act === "retry") start(S.sport);
  else if (act === "reconnect") { set({ stream: "reconnecting" }); setTimeout(() => set({ stream: "ok" }), 1200); }
  else if (act === "voice") set({ sheet: "voice" });
  else if (act === "voice-toggle") { if (hasSpeech) speechSynthesis.cancel(); set({ voice: S.voice === "on" ? "off" : "on", speaking: false }); }
  else if (act === "close") set({ sheet: null });
  else if (act === "fix") set({ fix: { key: key(S.sport, +t.dataset.i), phase: "edit" } });
  else if (act === "cancel" || act === "scrim") set({ fix: null, sheet: null });
  else if (act === "reject") { S.fixes[S.fix.key] = { rejected: true }; S.fix = null; toast("Line rejected."); }
  else if (act === "send") {
    const fixKey = S.fix.key, text = document.getElementById("fix-text").value.trim(), reason = S.fix.reason || "Wrong fact";
    set({ fix: { ...S.fix, phase: "sending" } });
    setTimeout(() => { S.fixes[fixKey] = { text, reason }; S.fix = null; toast("Fix sent. Kept beside the original."); }, 900);
  }
});
document.addEventListener("change", (e) => {
  if (e.target.name?.startsWith("voice-")) { S.voices[e.target.dataset.sport] = e.target.value; toast(`${e.target.value} commentator from the next line.`); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "fix-text") {
    const hadText = !!(S.fix.text ?? "x").trim();
    S.fix.text = e.target.value;
    if (hadText !== !!e.target.value.trim()) { render(); const ta = document.getElementById("fix-text"); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  if (e.target.name === "reason") S.fix.reason = e.target.value;
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (S.sheet || (S.fix && S.fix.phase !== "sending"))) set({ fix: null, sheet: null }); });
if (new URLSearchParams(location.search).has("still")) document.body.classList.add("still");
window.addEventListener("hashchange", applyHash);
applyHash();
</script>
</body>
</html>
